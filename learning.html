<style>
/* Layout: slim header, hero with a sample lesson card, features grid, long-form policy in a reading column */
:root {
  --bg: #F6F7FB;
  --surface: #FFFFFF;
  --fg: #151A2D;
  --muted: #565E76;
  --line: #E1E5EF;
  --accent: #3A56B8;
  --on-accent: #FFFFFF;
  --tint: rgba(58, 86, 184, .11);
  --font: 'IBM Plex Sans Arabic', 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1120; --surface: #161A2E; --fg: #ECEFF8; --muted: #9AA2BC; --line: #262B45;
    --accent: #93A9F2; --on-accent: #0E1120; --tint: rgba(147, 169, 242, .14);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1120; --surface: #161A2E; --fg: #ECEFF8; --muted: #9AA2BC; --line: #262B45;
  --accent: #93A9F2; --on-accent: #0E1120; --tint: rgba(147, 169, 242, .14);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--font); font-size: 16px; line-height: 1.7;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px;
}
a { color: var(--accent); }
.wrap { max-width: 920px; margin: 0 auto; }

/* header */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 16px; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; }
.brand-mark { width: 34px; height: 34px; border-radius: 10px; background: var(--tint); color: var(--accent); display: grid; place-items: center; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
.seg button { font: inherit; font-size: 14px; font-weight: 500; border: 0; background: none; color: var(--muted); padding: 5px 14px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* hero */
.hero { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, .85fr); gap: 36px; align-items: center; padding-block: 40px 28px; }
.kicker { color: var(--accent); font-weight: 700; font-size: 14px; letter-spacing: .02em; }
h1 { font-size: clamp(28px, 5vw, 42px); line-height: 1.25; margin: 8px 0 14px; text-wrap: balance; }
.lead { color: var(--muted); font-size: 17px; max-width: 52ch; margin: 0 0 22px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.btn { display: inline-flex; align-items: center; min-height: 48px; padding: 0 22px; border-radius: 999px; font-weight: 700; text-decoration: none; background: var(--accent); color: var(--on-accent); }
.btn-quiet { background: var(--tint); color: var(--accent); }

/* sample lesson card (mirrors a lesson row in the app) */
.sample { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 18px; }
.sample-tag { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
.row { display: flex; align-items: center; gap: 14px; padding: 12px; border: 1px solid var(--line); border-radius: 16px; }
.row + .row { margin-top: 10px; }
.circle { flex: none; width: 44px; height: 44px; border-radius: 50%; background: var(--tint); color: var(--accent); display: grid; place-items: center; }
.row-text { min-width: 0; }
.row-text b { display: block; font-size: 15px; }
.row-text span { display: block; font-size: 13px; color: var(--muted); }
.check { margin-inline-start: auto; color: var(--accent); }
.check.dim { opacity: .35; }

/* facts */
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-block: 8px 12px; }
.fact { border-top: 2px solid var(--accent); padding-top: 10px; font-weight: 500; }
.fact small { display: block; color: var(--muted); font-weight: 400; font-size: 14px; }

/* sections */
h2 { font-size: 26px; line-height: 1.3; margin: 56px 0 6px; text-wrap: balance; }
.sub { color: var(--muted); margin: 0 0 22px; max-width: 60ch; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 14px; }
.feat { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; }
.box { width: 40px; height: 40px; border-radius: 12px; background: var(--tint); color: var(--accent); display: grid; place-items: center; margin-bottom: 12px; }
.feat h3 { font-size: 17px; margin: 0 0 4px; }
.feat p { margin: 0; color: var(--muted); font-size: 15px; }

/* policy */
.policy { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: clamp(20px, 4vw, 36px); }
.summary { background: var(--tint); border-radius: 14px; padding: 16px 18px; margin-bottom: 8px; }
.summary b { color: var(--accent); }
.summary ul { margin: 8px 0 0; padding-inline-start: 20px; }
.policy h3 { font-size: 19px; margin: 30px 0 6px; }
.policy p, .policy li { max-width: 68ch; }
.policy p { margin: 0 0 12px; }
.policy ul { padding-inline-start: 22px; margin: 0 0 12px; }
.email { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.email code { font-family: inherit; direction: ltr; unicode-bidi: isolate; background: var(--tint); padding: 4px 10px; border-radius: 8px; user-select: all; }
.copy { font: inherit; font-size: 14px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); border-radius: 999px; padding: 4px 14px; cursor: pointer; }
.updated { color: var(--muted); font-size: 14px; margin-top: 24px; }
footer { margin-top: 40px; color: var(--muted); font-size: 14px; text-align: center; }

@media (max-width: 720px) {
  .hero { grid-template-columns: minmax(0, 1fr); gap: 24px; padding-block: 20px 12px; }
  .facts { grid-template-columns: minmax(0, 1fr); }
  h2 { margin-top: 44px; }
}
@media (prefers-reduced-motion: no-preference) { html { scroll-behavior: smooth; } }
</style>

function LINKS_PLACEHOLDER() { return '<li>' + LINKS.gps + '</li><li>' + LINKS.admob + '</li>'; }

var lang = 'en';
try { lang = localStorage.getItem('lang') || ''; } catch (e) {}
if (lang !== 'ar' && lang !== 'en') {
  lang = ((navigator.language || 'en').toLowerCase().indexOf('ar') === 0) ? 'ar' : 'en';
}

function renderFeatures() {
  var html = '';
  FEATURES.forEach(function (f) {
    var t = f[lang];
    html += '<div class="feat"><div class="box"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
      ICON[f.i] + '</svg></div><h3>' + t[0] + '</h3><p>' + t[1] + '</p></div>';
  });
  document.getElementById('featGrid').innerHTML = html;
}

function renderPolicy() {
  var P = POLICY[lang];
  var html = '<div class="summary"><b>' + P.summaryTitle + '</b><ul>';
  P.summary.forEach(function (s) { html += '<li>' + s + '</li>'; });
  html += '</ul></div>';
  P.sections.forEach(function (s) {
    html += '<h3>' + s[0] + '</h3>';
    s[1].forEach(function (p) {
      if (p === 'email') {
        html += '<p class="email"><code>' + EMAIL + '</code><button class="copy" type="button" id="copyBtn">' + P.copy + '</button></p>';
      } else if (p.indexOf('ul:') === 0) {
        html += '<ul>' + p.slice(3) + '</ul>';
      } else {
        html += '<p>' + p + '</p>';
      }
    });
  });
  html += '<p class="updated">' + UPDATED[lang] + '</p>';
  document.getElementById('policy').innerHTML = html;
  var btn = document.getElementById('copyBtn');
  if (btn) btn.addEventListener('click', function () {
    var done = function () { btn.textContent = P.copied; setTimeout(function () { btn.textContent = P.copy; }, 1500); };
    try {
      navigator.clipboard.writeText(EMAIL).then(done, function () { selectEmail(); });
    } catch (e) { selectEmail(); }
  });
}

function selectEmail() {
  var el = document.querySelector('.email code');
  if (!el) return;
  var r = document.createRange(); r.selectNodeContents(el);
  var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
}

function apply() {
  var root = document.documentElement;
  root.lang = lang; root.dir = (lang === 'ar') ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-t]').forEach(function (el) { el.textContent = UI[lang][el.getAttribute('data-t')]; });
  document.getElementById('btn-ar').setAttribute('aria-pressed', lang === 'ar');
  document.getElementById('btn-en').setAttribute('aria-pressed', lang === 'en');
  renderFeatures(); renderPolicy();
}

document.querySelectorAll('[data-set]').forEach(function (b) {
  b.addEventListener('click', function () {
    lang = b.getAttribute('data-set');
    try { localStorage.setItem('lang', lang); } catch (e) {}
    apply();
  });
});
apply();
</script>
